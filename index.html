<style>
  :root {
    --bg: #0b1424;
    --surface: rgba(148, 163, 184, 0.06);
    --line: rgba(148, 163, 184, 0.16);
    --text-strong: #e6edf6;
    --text: #9aabc2;
    --text-dim: #66778f;
    --accent: #6ee7b7;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--accent); color: var(--bg); }
  h1, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }

  .wrap {
    max-width: 960px; min-height: 100vh; min-height: 100svh;
    margin: 0 auto; padding: 72px 24px;
    display: flex; flex-direction: column; justify-content: center;
  }

  /* 1. 한 문장 + 한 줄 설명 */
  .headline {
    font-size: clamp(32px, 7vw, 60px); line-height: 1.3;
    font-weight: 700; letter-spacing: -0.03em; color: var(--text-strong);
    text-wrap: balance;
  }
  .headline em { font-style: normal; color: var(--accent); }
  .lead { margin-top: 20px; font-size: clamp(16px, 2.2vw, 19px); text-wrap: pretty; }

  /* 2. 숫자 성과 카드 */
  .stats { display: grid; gap: 12px; margin-top: 56px; }
  .stats li {
    padding: 22px 22px 20px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface);
  }
  .stats b {
    display: block; font-size: clamp(30px, 4vw, 40px); line-height: 1.2;
    font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stats b i { font-style: normal; color: var(--accent); margin: 0 2px; }
  .stats span { display: block; margin-top: 10px; font-size: 15px; line-height: 1.55; color: var(--text-strong); }
  .stats small { display: block; margin-top: 4px; font-size: 13px; color: var(--text-dim); }

  /* 3. 협업 제안하기 버튼 */
  .cta { margin-top: 48px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 17px 28px; border-radius: 8px;
    background: var(--accent); color: #062019;
    font-size: 16px; font-weight: 700; line-height: 1.2; text-decoration: none;
    transition: background-color .2s;
  }
  .btn svg { width: 18px; height: 18px; flex: none; transition: transform .2s; }
  .btn:hover { background: #8ff0cb; }
  .btn:hover svg { transform: translateX(3px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  @media (min-width: 720px) {
    .wrap { padding: 96px 48px; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .stats li { padding: 26px 24px 24px; }
    .btn { display: inline-flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn svg { transition: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="headline"><em>혈당 데이터</em>로 고객의 하루를 더 유익하게 만듭니다.</h1>
  <p class="lead">식품·유통에서 19년간 브랜드와 신사업을 키워 온 HLB라이프케어 김성호입니다.</p>

  <ul class="stats" aria-label="주요 성과">
    <li><b>5.6<i>→</i>36%</b><span>쁘띠첼 미초 시장점유율</span><small>CJ제일제당 · 2012→2015</small></li>
    <li><b>40여 종</b><span>건강·영양 HMR 라라밀스 신제품 출시</span><small>삼성웰스토리 · 2020–2021</small></li>
    <li><b>3개월</b><span>6개월간 멈춰 있던 3자 제휴 신사업 출시</span><small>동원F&amp;B · 2011–2012</small></li>
  </ul>

  <p class="cta">
    <a class="btn" href="mailto:dodream21@empas.com?subject=%5B%ED%98%91%EC%97%85%20%EC%A0%9C%EC%95%88%5D%20">협업 제안하기

    </a>
  </p>
</main>
</body>
</html>
